<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" width="100%" height="100%">
  <defs>
    <!-- Background & Canvas Gradients -->
    <radialGradient id="bg-glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e1035" stop-opacity="0.8" />
      <stop offset="45%" stop-color="#0e0a1a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#040407" />
    </radialGradient>

    <radialGradient id="cyan-glow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06283d" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#040407" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Card Surfaces -->
    <linearGradient id="card-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181726" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0c0b14" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="hud-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Text & Glow Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filters for Depth and Elevation -->
    <filter id="glass-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.8" />
    </filter>
    
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2d2b45" fill-opacity="0.35" />
    </pattern>
  </defs>

  <!-- Base Canvas -->
  <rect width="1280" height="520" fill="#040407" />
  <rect width="1280" height="520" fill="url(#bg-glow)" />
  <rect width="1280" height="520" fill="url(#cyan-glow)" />
  <rect width="1280" height="520" fill="url(#dot-grid)" />

  <!-- Subtle Cyber Isometric Background Lines -->
  <g stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04" fill="none">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="440" x2="1280" y2="440" />
    <line x1="240" y1="0" x2="240" y2="520" />
    <line x1="1040" y1="0" x2="1040" y2="520" />
  </g>

  <!-- LEFT HERO: Editorial Title, Badges & High-Tech HUD -->
  <g transform="translate(80, 75)">
    <!-- Genesis Pill Badge -->
    <g>
      <rect x="0" y="0" width="240" height="28" rx="14" fill="#131124" stroke="url(#card-border)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10b981" filter="url(#neon-glow)" />
      <text x="28" y="18" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#a5b4fc" letter-spacing="1.2">SYSTEM: CORE v2.0 READY</text>
    </g>

    <!-- Main Typography Header -->
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="900" fill="url(#title-grad)" letter-spacing="-1.5">
      AGENT GENESIS
    </text>
    
    <text x="0" y="112" font-family="'JetBrains Mono', 'SF Mono', Consolas, monospace" font-size="16" font-weight="500" fill="#38bdf8" letter-spacing="3">
      // AUTONOMOUS BOOTSTRAPPER &amp; POWER SUITE
    </text>

    <!-- Crisp Description -->
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Transform any raw LLM into a tailored, persistent senior peer.
    </text>
    <text x="0" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="400" fill="#64748b">
      Built for Antigravity IDE, Claude Code, Cursor &amp; Windsurf.
    </text>

    <!-- Bento Metric Badges (Horizontal Row) -->
    <g transform="translate(0, 225)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="135" height="64" rx="10" fill="#0d0c18" stroke="#221f3b" stroke-width="1" />
      <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">OFFLINE VAULT</text>
      <text x="16" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">911<tspan font-size="14" fill="#a855f7"> SKILLS</tspan></text>

      <!-- Metric 2 -->
      <rect x="147" y="0" width="135" height="64" rx="10" fill="#0d0c18" stroke="#221f3b" stroke-width="1" />
      <text x="163" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">BRAND SYSTEMS</text>
      <text x="163" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#ffffff">74<tspan font-size="14" fill="#38bdf8"> STYLES</tspan></text>

      <!-- Metric 3 -->
      <rect x="294" y="0" width="135" height="64" rx="10" fill="#0d0c18" stroke="#221f3b" stroke-width="1" />
      <text x="310" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">TOKEN ECONOMY</text>
      <text x="310" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#10b981">-80%<tspan font-size="12" fill="#6ee7b7"> GRAPH</tspan></text>
    </g>

    <!-- Origin Line -->
    <g transform="translate(0, 325)">
      <circle cx="6" cy="6" r="3" fill="#818cf8" />
      <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#64748b">
        DESIGNED &amp; REFINED BY <tspan fill="#e2e8f0" font-weight="700">VIKTOR (VIK)</tspan> • <tspan fill="#38bdf8">VIKLABS.PAGES.DEV</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT HERO: Sleek Glassmorphic Terminal + Synapse Matrix -->
  <g transform="translate(680, 50)" filter="url(#glass-shadow)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="520" height="420" rx="16" fill="url(#card-surface)" stroke="url(#card-border)" stroke-width="1.5" />

    <!-- macOS Window Chrome / Titlebar -->
    <rect x="0" y="0" width="520" height="42" rx="16" fill="#11101e" fill-opacity="0.8" />
    <path d="M 0 42 L 520 42" stroke="#25223d" stroke-width="1" />
    
    <!-- Window Control Buttons -->
    <circle cx="22" cy="21" r="5.5" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="40" cy="21" r="5.5" fill="#f59e0b" fill-opacity="0.85" />
    <circle cx="58" cy="21" r="5.5" fill="#10b981" fill-opacity="0.85" />
    
    <!-- Title Tab -->
    <text x="260" y="25" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">
      genesis-wizard // antigravity-ide
    </text>

    <!-- Terminal Inner Content -->
    <g transform="translate(24, 62)" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5" xml:space="preserve">
      <!-- Prompt Line -->
      <text x="0" y="16" fill="#64748b">$ <tspan fill="#38bdf8" font-weight="600">agent</tspan> <tspan fill="#a5b4fc">--init</tspan> <tspan fill="#ffffff">https://github.com/xvacorx/agent-genesis-kit</tspan></text>
      
      <!-- System Output -->
      <text x="0" y="44" fill="#10b981">✔ Language Engine: <tspan fill="#ffffff" font-weight="700">Universal Auto-Detect (Any Language)</tspan></text>
      <text x="0" y="68" fill="#10b981">✔ Workspace integrity: <tspan fill="#ffffff">Additive non-destructive merge</tspan></text>
      <text x="0" y="92" fill="#10b981">✔ Graphify token-guard: <tspan fill="#34d399">ACTIVE (AST Knowledge Graph)</tspan></text>

      <!-- Interactive HUD Card inside Terminal -->
      <g transform="translate(0, 115)">
        <rect x="0" y="0" width="472" height="135" rx="10" fill="#090812" stroke="#221e38" stroke-width="1" />
        
        <!-- Header inside card -->
        <rect x="0" y="0" width="472" height="28" rx="10" fill="#131124" />
        <path d="M 0 28 L 472 28" stroke="#221e38" stroke-width="1" />
        <text x="14" y="18" font-size="11" font-weight="700" fill="#c084fc">⚡ ACTIVE PROFILE: CURATED ELITE (all-in-one)</text>
        
        <text x="14" y="52" fill="#94a3b8">• Core Protocol:    <tspan fill="#38bdf8">self-improving</tspan>, <tspan fill="#38bdf8">systematic-debug</tspan>, <tspan fill="#38bdf8">antislop</tspan></text>
        <text x="14" y="74" fill="#94a3b8">• Design Systems:   <tspan fill="#818cf8">74 Brand Packs</tspan> (Stripe, Linear, Apple, Vercel)</text>
        <text x="14" y="96" fill="#94a3b8">• Living Memory:    <tspan fill="#10b981">memory/MEMORY.md</tspan> synchronized</text>
        <text x="14" y="118" fill="#94a3b8">• Token Footprint:  <tspan fill="#fbbf24">&lt; 2,100 tokens</tspan> (Zero Prompt Bloat)</text>
      </g>

      <!-- Terminal Status Line -->
      <text x="0" y="280" fill="#818cf8">⚡ Matrix Ready: <tspan fill="#ffffff">Open new chat session to start collaborating.</tspan></text>
      <text x="0" y="304" fill="#64748b">Credits: <tspan fill="#e2e8f0">Architected by Viktor at </tspan><tspan fill="#38bdf8">viklabs.pages.dev</tspan></text>
      
      <!-- Blinking Cursor Line -->
      <g transform="translate(0, 328)">
        <text x="0" y="0" fill="#38bdf8" font-weight="700">&gt;</text>
        <rect x="15" y="-12" width="8" height="15" fill="#38bdf8" opacity="0.9">
          <animate attributeName="opacity" values="0.9;0;0.9" dur="1s" repeatCount="indefinite" />
        </rect>
      </g>
    </g>
  </g>
</svg>
